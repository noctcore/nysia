name: Bug report
description: The daemon, the CLI or the window crashed, lost a session or did the wrong thing.
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. If the bug lets something other than you drive or read a session, or runs a command you did not start, **do not file it here**: report it privately as [SECURITY.md](https://github.com/noctcore/nysia/blob/main/SECURITY.md) describes.

        Never paste secrets, tokens or terminal output you have not read.
  - type: dropdown
    id: surface
    attributes:
      label: Where
      options:
        - The window (tabs, sidebar, terminal view)
        - The daemon (nysia --daemon)
        - The CLI (nysia session, nysia terminal, ...)
        - Projects, worktrees or GitHub issues
        - Agent status
        - Building from source
        - Not sure
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Commit
      description: The output of `git rev-parse --short HEAD` in the checkout you built.
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      description: For example Windows 11 with pwsh 7.5, or macOS 15 with zsh.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The smallest set of steps or CLI verbs that shows it.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened
      description: The output, the error envelope from `--json`, or the daemon log lines. Read it before pasting.
      render: text
    validations:
      required: true
