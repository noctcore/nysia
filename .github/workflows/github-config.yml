# Checks the checks.
#
# The scripts under .github/scripts are the only executable part of this repository that
# no vitest project covers — `vitest.config.ts` has projects for scripts/, tools/lint-meta
# and apps/web, and .github is in none of them. Without this workflow they would ship
# untested, which for a pair of gates is the failure they exist to prevent.
#
# Each script self-tests first and then runs for real, so a rule that has stopped tripping
# fails here before it is trusted on a pull request.
#
# No `paths` filter, deliberately. It is tempting — every step here reads `.github/**` —
# but the label drift check compares labels.yml against the live repository, and a label
# renamed in the GitHub UI has nothing to do with which files a pull request touches.
# Filtered on paths, that drift would surface only on the next pull request that happened
# to edit `.github/**`, while labels.yml claimed it was checked. The whole job is
# read-only and runs in about seven seconds, which is a cheaper price than a guarantee
# that is true only sometimes. `pnpm ts-drift` runs on every CI run for the same reason.

name: github-config

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  scripts:
    name: workflow and label gates
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # `gh label list` reads the repository's labels, which live behind the issues
      # scope. Read-only, and nothing here writes a label.
      issues: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: self-test the workflow pin rules
        run: node .github/scripts/check-workflow-pins.mjs --self-test

      # The real scan. Every action in this directory pinned to a commit SHA, and no
      # pull_request_target workflow reaching for the pull request head.
      - name: check every workflow
        run: node .github/scripts/check-workflow-pins.mjs

      - name: self-test the label rules
        run: node .github/scripts/require-pr-facets.mjs --self-test

      - name: self-test the label drift rule
        run: node .github/scripts/check-labels-drift.mjs --self-test

      # The drift check proper. `yq` is pre-installed on the GitHub-hosted Ubuntu
      # runners, which is what makes a real parse available here — labels.yml used to
      # claim a drift check needed a YAML parser the repository does not have, and that
      # was simply wrong.
      - name: check labels.yml still describes the repository
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          yq --version
          yq -o=json '.' .github/labels.yml > "$RUNNER_TEMP/declared.json"
          gh label list --limit 200 --json name,description,color > "$RUNNER_TEMP/live.json"
          node .github/scripts/check-labels-drift.mjs "$RUNNER_TEMP/declared.json" "$RUNNER_TEMP/live.json"
