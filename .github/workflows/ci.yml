name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # A stack trace is worth more than the handful of seconds it costs on a failure.
  RUST_BACKTRACE: 1

jobs:
  gates:
    name: gates (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows-primary development, macOS as the second signing target. No Linux runner:
        # there is no Linux build of Nysia in v1, so a green Linux job would prove nothing.
        os: [windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes; the only git this job runs is the working-tree
          # check at the end. Leaving the token in .git/config would expose it to
          # every build script the gates execute for no benefit.
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      # rustup honours rust-toolchain.toml, including its components, so the pin lives in
      # one place. This runs before the cache step so the toolchain exists when it keys.
      - name: Install the pinned rust toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # portable-pty comes from the wezterm git repository, which is a large clone;
          # rust-cache covers ~/.cargo/git as well as the registry.
          key: ${{ matrix.os }}

      - name: Install node dependencies
        run: pnpm install --frozen-lockfile

      # tauri::generate_context! reads frontendDist at compile time, so apps/web/dist must
      # exist before any cargo command that touches apps/desktop/src-tauri.
      - name: Build the web frontend
        run: pnpm build

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: cargo test
        run: cargo test --workspace

      - name: pnpm typecheck
        run: pnpm typecheck

      - name: pnpm lint
        run: pnpm lint

      - name: pnpm test
        run: pnpm test

      - name: pnpm ts-drift
        run: pnpm ts-drift

      # Every gate ships with a proof that it trips (traps register #13). These are separate
      # named steps, not folded into `pnpm test`, so a skipped proof is visible in the run.
      - name: prove the ts-rs drift guard trips
        run: pnpm prove:ts-drift

      - name: prove the lint-meta architecture rules trip
        run: pnpm prove:lint-meta

      - name: prove the eslint import bans trip
        run: pnpm prove:eslint-bans

      - name: prove the sidecar check trips
        run: pnpm prove:sidecar

      # The proof scripts mutate tracked files and restore them. If a restore ever fails,
      # the run must go red rather than leave the next step guessing.
      - name: check the working tree is clean
        shell: bash
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "A gate left the working tree dirty:"
            git status --porcelain
            git diff
            exit 1
          fi

  # The app as it is shipped, which is the only place the sidecar can be checked for.
  # `cargo test` proves the window *starts* a runtime; nothing in the gates above proves the
  # bundle **contains** one, and an app that builds cleanly and ships none is invisible until
  # somebody launches it on a machine with no daemon (§12 q6).
  bundle:
    name: bundle (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # One bundle target per platform, deliberately the cheap one: `targets: "all"` on
          # macOS also builds a dmg, which needs a mounted disk image the runner sometimes
          # refuses, and this job is asking a question about file layout rather than about
          # installers.
          - os: windows-latest
            bundles: nsis
          - os: macos-latest
            bundles: app

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install the pinned rust toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Its own key: this job builds `--release` and the gates build `debug`, and sharing
          # a key would have each evict the other's artifacts on every run.
          key: bundle-${{ matrix.os }}

      - name: Install node dependencies
        run: pnpm install --frozen-lockfile

      # The same binary the CLI ships (D-11), built for the profile that is bundled.
      - name: Build the nysia runtime
        working-directory: crates/nysia
        run: cargo build --release -p nysia

      - name: Stage the nysia sidecar
        run: node scripts/sidecar.ts stage --profile release

      # Through the package script, so the `--config` that merges the sidecar declaration
      # lives in exactly one place and a bundle built by hand carries it too. `tauri build`
      # runs the web build itself through `beforeBuildCommand`.
      - name: Build the app bundle
        run: pnpm --filter @nysia/desktop run build --bundles ${{ matrix.bundles }}

      # **Inside what a user receives, and nowhere else.** A check of `target/release` would
      # be worse than none: this job builds the runtime into that directory itself, two steps
      # up, so it passes whether or not anything bundled it — which is exactly the hole the
      # Windows half of this job used to have. Globbed rather than spelled, so a change to
      # `productName` renames the check's subject instead of silently skipping it.
      - name: The runtime ships inside the macOS app
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          app=$(ls -d target/release/bundle/macos/*.app | head -n 1)
          echo "checking $app"
          node scripts/sidecar.ts verify "$app/Contents/MacOS"

      # **The installer's payload, which is the only thing a Windows user receives.** Listing
      # the installer proved nothing: it says a file was produced, not what is inside it. So
      # this runs it to a prefix of its own and checks there — the same question the macOS
      # step asks of the `.app`, on the platform this project is primary on.
      #
      # `/S` is NSIS silent and `/D=` sets the directory; `/D` must come last and unquoted,
      # which is why the prefix has no spaces in it.
      - name: The runtime ships inside the Windows installer
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $installer = (Get-ChildItem target/release/bundle/nsis/*.exe | Select-Object -First 1).FullName
          $prefix = 'C:\nysia-install-check'
          Write-Host "installing $installer to $prefix"
          Start-Process -FilePath $installer -ArgumentList '/S', "/D=$prefix" -Wait
          if (-not (Test-Path $prefix)) { throw "the installer wrote nothing to $prefix" }
          Get-ChildItem -Recurse $prefix | ForEach-Object { Write-Host $_.FullName }
          node scripts/sidecar.ts verify $prefix
          if ($LASTEXITCODE -ne 0) { throw 'the installed app does not carry its runtime' }
          # The installer may launch what it installed; nothing after this needs it running.
          Get-Process Nysia, nysiad -ErrorAction SilentlyContinue | Stop-Process -Force

      - name: prove the sidecar check trips
        run: pnpm prove:sidecar
