# Applies area labels from the paths a PR touches, and assigns the PR if nobody has.
#
# SECURITY INVARIANT — read before editing.
#
# This workflow runs on `pull_request_target`, so its token is writable even when the
# PR comes from a fork. That is the only way to label a fork PR at all: a `pull_request`
# run from a fork gets a read-only token and can do nothing here.
#
# The price is that `pull_request_target` checks out the *base* branch by default and
# runs with the base repository's secrets. Therefore:
#
#   This workflow must never check out, build, or execute anything from the PR head.
#
# There is no `actions/checkout` step below and there must never be one. actions/labeler
# reads .github/labeler.yml over the API at `github.sha` — which under this trigger is
# the base commit, not the PR's — so the configuration an attacker can edit is never the
# configuration that runs. Adding a checkout of `github.event.pull_request.head.sha`
# would hand a fork's code a token that can write to this repository.
#
# .github/scripts/check-workflow-pins.mjs catches both a head reference here and a `uses:`
# pinned to a mutable tag. It is a lint against honest mistakes, not a boundary — read its
# header for what it does and does not guarantee. The invariant above is the boundary; the
# check only makes it harder to break by accident.

name: pr-triage

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

# Deliberately not `labeled`/`unlabeled`: this workflow writes labels, and those types
# would make it re-trigger itself.

permissions: {}

concurrency:
  group: pr-triage-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  label:
    name: apply area labels
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      # Bootstrap. actions/labeler resolves its configuration from the base commit, so
      # on the very PR that introduces .github/labeler.yml the file does not exist yet
      # and the action exits non-zero. The ask was that this behave on a PR it cannot
      # label rather than fail loudly, and the same applies to a PR opened against a
      # branch that predates the config.
      - name: check the base branch carries a labeler config
        id: config
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # Only a 404 means "the base branch predates the config". A rate limit, an
          # auth failure or a network error must NOT be read as absence: treating every
          # failure as a 404 would silently skip labelling whenever the API had a bad
          # minute, and the notice would say the config was missing when it was not.
          # Absence skips; anything else fails the job.
          set +e
          error=$(gh api "repos/$GH_REPO/contents/.github/labeler.yml?ref=$BASE_SHA" --silent 2>&1 >/dev/null)
          status=$?
          set -e

          if [ "$status" -eq 0 ]; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          elif printf '%s' "$error" | grep -q 'HTTP 404'; then
            echo 'present=false' >> "$GITHUB_OUTPUT"
            echo "::notice::No .github/labeler.yml on the base commit $BASE_SHA; skipping area labels. This is expected on the pull request that adds it."
          else
            echo "::error::Could not read .github/labeler.yml at $BASE_SHA, and it was not a 404: $error"
            exit 1
          fi

      - name: apply area labels
        if: steps.config.outputs.present == 'true'
        # v5.0.0, and v7 is current. Staying on v5 deliberately: this is the version
        # whose matching algorithm was read at this exact commit to settle the `any`/
        # `all` semantics below, and a pin is only worth what was verified behind it.
        # Worth revisiting on its own, with the same reading — v5 runs on Node 20, which
        # the runners will eventually stop supporting, and that is the clock on this pin.
        uses: actions/labeler@8558fd74291d67161a8a78ce36a881fa63b766a9 # v5.0.0
        with:
          repo-token: ${{ github.token }}
          # Add only. A label a reviewer applied by hand is never removed by this run.
          sync-labels: false

  assign:
    name: assign when unassigned
    runs-on: ubuntu-latest
    # Only when nobody owns the PR yet — an existing assignee, human or otherwise, is
    # left exactly as it is. Bots assign their PRs to nobody on purpose; leave them.
    if: >-
      github.event.pull_request.assignees[0] == null &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    permissions:
      pull-requests: write
    steps:
      - name: assign to the maintainer
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh pr edit "$PR" --add-assignee Shironex
          echo "::notice::Assigned #$PR to Shironex; it had no assignee."
