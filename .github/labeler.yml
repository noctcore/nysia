# Path -> area label, read by actions/labeler in .github/workflows/pr-triage.yml.
#
# THIS FILE MAY NEVER WRITE A TYPE LABEL. Areas are mechanical — a path determines them
# — and the Extras (`dependencies`, `gate`, `design-system`) are facts about the diff.
# Types are editorial: only the author knows whether a change is a `bug` or a `chore`,
# and a PR that happens to touch a doc file is not a `documentation` PR.
#
# This is not only a style rule, it is a deadlock. `documentation` used to be applied
# here from `docs/**` while pr-facets.yml counts it as a type, so any enhancement, bug or
# chore PR that also touched docs ended up with two types and failed. Worse, it failed
# *intermittently*: labels written with GITHUB_TOKEN never trigger other workflows, so
# the labeler cannot re-run the facet check, and on `opened` and `synchronize` the two
# start concurrently — the check reads the labels either before or after the write
# depending on timing. Green on one push, red on the next, and a label removed by hand
# comes straight back on the next synchronize because the labeler is add-only.
#
# .github/scripts/check-labeler-config.mjs fails CI if a type label appears as a key
# here. The full label set, and which facet each label belongs to, is .github/labels.yml.
#
# The labeler runs with `sync-labels` off (the default), so it never *decides* to remove
# a label: it computes the set it wants, unions it with the labels it read, and writes
# the result. But it writes with `issues.setLabels`, which replaces the whole set — so a
# label added by a human in the window between that read and that write is dropped.
#
# The honest guarantee is therefore: the labeler removes nothing it read, and nothing is
# removed on a later run for having stopped matching. A label applied during the few
# seconds a run is in flight can still be lost, and re-applying it sticks. That is
# upstream v5 behaviour, not something this repository can fix from the config.
#
# Matching is minimatch. `any-glob-to-any-file` asks whether at least one changed file
# matches; `all-globs-to-all-files` asks whether *every* changed file matches, which is
# how a negated glob carves an exception out.
#
# The `all:` wrapper on `area:web` is load-bearing, not decoration. A match object with
# no top-level key defaults to `any`, so two conditions written without it are OR-ed —
# and `all-globs-to-all-files: ['!apps/web/src/generated/**', …]` is true of almost every
# pull request in the repository, which would have put `area:web` on all of them.
# Combining a positive glob with a negated one always needs `all:`.
# .github/scripts/check-labeler-config.mjs fails CI if that is ever dropped.

# A Rust module is either `foo.rs` or `foo/mod.rs`, and which one a module uses changes
# over its life. Every area below therefore matches both spellings. `area:git` matched
# only `src/git/**` while the crate actually has `src/git.rs`, so the label could never
# fire at all — a dead rule that looked fine in review.
'area:daemon':
  - changed-files:
      - any-glob-to-any-file:
          - 'crates/nysia/**'
          - 'crates/nysia-core/src/rpc/**'
          - 'crates/nysia-core/src/rpc.rs'
      # Everything else in the core that no narrower area owns: the manifest, lib.rs,
      # store.rs, and any module added later that has not yet earned its own label. A
      # catch-all so that a new file in the core cannot end up with no area at all.
      - all-globs-to-any-file:
          - 'crates/nysia-core/**'
          - '!crates/nysia-core/src/pty/**'
          - '!crates/nysia-core/src/pty.rs'
          - '!crates/nysia-core/src/vt/**'
          - '!crates/nysia-core/src/vt.rs'
          - '!crates/nysia-core/src/git/**'
          - '!crates/nysia-core/src/git.rs'
          - '!crates/nysia-core/src/worktree/**'
          - '!crates/nysia-core/src/worktree.rs'

'area:pty':
  - changed-files:
      - any-glob-to-any-file:
          - 'crates/nysia-core/src/pty/**'
          - 'crates/nysia-core/src/pty.rs'

'area:vt':
  - changed-files:
      - any-glob-to-any-file:
          - 'crates/nysia-core/src/vt/**'
          - 'crates/nysia-core/src/vt.rs'

'area:git':
  - changed-files:
      - any-glob-to-any-file:
          - 'crates/nysia-core/src/git/**'
          - 'crates/nysia-core/src/git.rs'
          - 'crates/nysia-core/src/worktree/**'
          - 'crates/nysia-core/src/worktree.rs'

# D-13: Rust is the sole wire authority and the TypeScript under apps/web/src/generated
# is ts-rs output, so a change to either side is a change to the same contract.
'area:proto':
  - changed-files:
      - any-glob-to-any-file:
          - 'crates/nysia-proto/**'
          - 'apps/web/src/generated/**'

# The transport is the webview's half of the Tauri boundary, and one of the two places
# lint-meta allows a tauri import at all.
'area:desktop':
  - changed-files:
      - any-glob-to-any-file:
          - 'apps/desktop/**'
          - 'apps/web/src/transport/**'

# The web app proper: everything under apps/web that is not generated bindings or the
# transport, both of which are labelled above.
#
# `all-globs-to-any-file` ANDs its globs against each file in turn, so this reads "some
# changed file is under apps/web and is neither generated nor transport". That is a
# per-file exclusion, and it is why this no longer carries the caveat it used to: the
# earlier `- all:` plus `all-globs-to-all-files` form asked the question of the whole
# pull request at once, so a single generated binding suppressed `area:web` for every
# hand-written file beside it. A comment here once claimed minimatch had no way to
# express a per-file AND. It does, and this is it.
'area:web':
  - changed-files:
      - all-globs-to-any-file:
          - 'apps/web/**'
          - '!apps/web/src/generated/**'
          - '!apps/web/src/transport/**'

'area:build':
  - changed-files:
      - any-glob-to-any-file:
          - '.github/**'
          - 'tools/**'
          - 'scripts/**'
          - 'Cargo.toml'
          - 'Cargo.lock'
          - 'package.json'
          - 'pnpm-lock.yaml'
          - 'pnpm-workspace.yaml'
          - 'rust-toolchain.toml'
          # Root tooling config. Enumerated rather than matched with '*', because
          # README.md and CLAUDE.md also sit at the root and are not build files.
          - '.editorconfig'
          - '.gitattributes'
          - '.gitignore'
          - '.npmrc'
          - 'clippy.toml'
          - 'rustfmt.toml'
          - 'eslint.config.js'
          - 'tsconfig.json'
          - 'tsconfig.base.json'
          - 'vitest.config.ts'

# `dependencies` is an Extra, not a type: a manifest change is a fact about the diff, so
# a path can decide it. A PR can be an `enhancement` that also bumps a lockfile.
'dependencies':
  - changed-files:
      - any-glob-to-any-file:
          - 'Cargo.toml'
          - 'Cargo.lock'
          - 'crates/*/Cargo.toml'
          - 'apps/desktop/src-tauri/Cargo.toml'
          - 'package.json'
          - 'apps/*/package.json'
          - 'tools/*/package.json'
          - 'pnpm-lock.yaml'
          - 'pnpm-workspace.yaml'

# Trap 12: a gate that passes without exercising anything is worse than no gate. The
# prove scripts and lint-meta are where that rule is enforced, so touching them is
# worth a reviewer's attention regardless of which area it lands in.
'gate':
  - changed-files:
      - any-glob-to-any-file:
          - 'scripts/prove-*'
          - 'tools/lint-meta/**'

'design-system':
  - changed-files:
      - any-glob-to-any-file:
          - 'docs/design/**'
