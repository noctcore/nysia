# A real cargo workspace, resolvable offline: every dependency is a path dependency, so
# `cargo metadata` needs no registry and no network.
[workspace]
resolver = "3"
members = [
  "vendor/tauri",
  "vendor/third",
  "crates/nysia-proto",
  "crates/nysia-core",
  "crates/nysia",
  "crates/nysia-hook",
  "crates/nysia-shim",
  "apps/desktop/src-tauri",
]
