[package]
name = "nysia-desktop"
description = "The Nysia window: a Tauri v2 client of the nysiad socket, deliberately thin."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "nysia-desktop"
path = "src/main.rs"

[lints]
workspace = true

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
nysia-core = { workspace = true }
nysia-proto = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }
tauri = { workspace = true }
# The folder picker behind **Add a project**, driven from `commands::project_pick_folder`
# and never from the webview — see the workspace table for why that means no `dialog:`
# permission in `capabilities/default.json`.
tauri-plugin-dialog = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
# For the interop tests only, which bind a real `nysia_core::rpc::Daemon` and drive this
# client against it over a real socket. The daemon's accept loop is async; this client is
# not, and deliberately so (every command is `spawn_blocking`), so the runtime lives on a
# thread of the harness's own and the test body stays synchronous.
tokio = { workspace = true }

[features]
# Set by `tauri build` for production bundles: the webview then loads the frontend through
# the custom protocol instead of a dev server. DO NOT REMOVE.
custom-protocol = ["tauri/custom-protocol"]
