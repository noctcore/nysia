[workspace]
resolver = "3"
members = [
  "apps/desktop/src-tauri",
  "crates/nysia",
  "crates/nysia-core",
  "crates/nysia-proto",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
repository = "https://github.com/noctcore/nysia"
publish = false

# Every dependency v0.1 will need is declared here by the scaffold wave, so that both
# lockfiles are fully populated and no later wave has to touch a shared file. Adding a
# crate to this table is a coordinator-owned change.
[workspace.dependencies]
nysia-core = { path = "crates/nysia-core" }
nysia-proto = { path = "crates/nysia-proto" }

# PTY. Pinned to git `main`, never crates.io 0.9.0: the published release drops the
# ConPTY `RESIZE_QUIRK` / `WIN32_INPUT_MODE` flags we depend on (traps register #5).
portable-pty = { git = "https://github.com/wezterm/wezterm", branch = "main" }
# Terminal state lives in Rust (D-7); this is the grid.
alacritty_terminal = "0.26"
# State store (D-12). `bundled` so the SQLite amalgamation is compiled in and no
# system library has to be present on a contributor's machine.
rusqlite = { version = "0.40", features = ["bundled"] }

tokio = { version = "1.53", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Rust is the sole wire authority; TypeScript is generated from it, never the reverse (D-13).
ts-rs = "12.0"
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.6", features = ["derive"] }
uuid = { version = "1.26", features = ["v4", "serde"] }
# Raw `killpg` / `setsid` for Unix process-group teardown, which `portable-pty`'s own
# `ChildKiller` does not do: it signals the direct child only (§7.1).
libc = "0.2"

tauri = { version = "2.11", features = [] }
tauri-build = { version = "2.6", features = [] }

# The Win32 surface v0.1 needs, declared up front so wave 2 never edits this table:
# Job Objects with `JOB_OBJECT_LIMIT_KILL_ON_JOB_CLOSE` for tree-kill, because ConPTY has
# no signals (traps register #7); Pipes for `GetNamedPipeClientProcessId`, which is how the
# daemon learns a caller's pid from the kernel rather than from an echoed token; Security
# for the owner-only ACL on the token file beside the socket; ToolHelp for walking a
# caller's pid up to a session the daemon owns.
[workspace.dependencies.windows]
version = "0.62"
features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_JobObjects",
  "Win32_System_Pipes",
  "Win32_System_Threading",
]

# CLAUDE.md §6 as a gate rather than a convention. `clippy.toml` re-allows both inside
# tests, where a panic is the assertion.
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[workspace.lints.rust]
missing_docs = "warn"
